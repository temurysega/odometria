# Параметры узла odometria. Значения по умолчанию подобраны офлайн
# на предоставленных записях (tools/replay.py).
odometria:
  ros__parameters:
    # выход
    output_rate: 50.0          # Гц, метки на сетке 1/output_rate в шкале входных header.stamp
    frame_id: map              # плоские координаты MGRS, z высота (REP 103)
    child_frame_id: base_link
    diagnostics_rate: 5.0
    # карта и привязка
    use_map: true              # false: относительная одометрия вдоль начального курса
    map_file: ""               # пусто: встроенная карта data/track_map.json
    use_landmarks: true        # коррекция по местам остановок
    particles: 1500            # 0: фильтр Калмана вместо облака частиц
    init_window: 1.0           # с, окно начальной выставки GNSS
    output_point: base_link    # base_link, master или rover
    master_x: -9.873           # м, tf master антенны в base_link
    rover_x: 2.563             # м, tf rover антенны в base_link
    antenna_z: 3.0             # м, высота антенн над base_link
    mgrs_zone: 37              # зона UTM
    mgrs_origin_east: 300000.0     # угол квадрата сетки MGRS, как в картах организаторов
    mgrs_origin_north: 6100000.0
    gnss_wait: 5.0             # с без GNSS, после которых включается относительная одометрия
    max_map_offset: 15.0       # м, допуск привязки стартовой точки
    scale_prior: 1.0           # априорный масштаб колёс
    scale_sigma: 0.008         # его СКО (износ бандажей до 1,5 %)
    stop_speed: 0.03           # м/с, порог остановки
    stop_confirm: 1.0          # с, подтверждение остановки
    command_timeout: 0.5       # с, после этого позиция контроллера считается нулевой
    # наблюдатель скорости
    model_file: ""             # пусто: встроенная таблица data/traction_model.json
    wheel_scale: 0.2777777777777778   # сырое значение датчика в км/ч, перевод в м/с
    sigma_wheel: 0.03          # м/с, шум датчика тележки
    sigma_model: 0.35          # м/с² на корень секунды, ошибка модели ускорения
    sigma_bias: 0.02           # дрейф адаптивной поправки
    pair_abs: 0.25             # м/с, допуск согласия тележек
    pair_tight: 0.12           # м/с, плотное согласие, при котором тележкам верим вопреки модели
    gate_min: 0.35             # м/с, минимальный строб невязки
    rise_margin: 1.6           # м/с², превышение темпа над моделью = боксование
    max_decel: 6.0             # м/с², замедление колеса сверх этого = юз
    resync_after: 4.0          # с, пересинхронизация после длительной отбраковки
    sigma_disagree: 0.2        # м/с, вес выбранной тележки при их расхождении
